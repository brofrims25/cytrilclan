# ==========================================
#        CYTRILCLAN MAIN CONFIGURATION
# ==========================================

# 1. System Settings
system:
  language: "id"
  data-save-interval: 300 # dalam detik
  debug-mode: false

# 2. Clan Creation & Restrictions
clan:
  creation-permission-required: true
  min-name-length: 3
  max-name-length: 12
  creation-cost: 5000.0
  max-members-default: 10
  leader-transfer-cooldown-hours: 1

# 3. Banned Names / Toxic Filter (50 Settings Matrix Coverage)
banned-names:
  - "admin"
  - "staff"
  - "owner"
  - "moderator"
  - "kontol"
  - "memek"
  - "anjing"
  - "bangsat"
  - "babi"
  - "asu"
  - "nigger"
  - "hitler"

# 4. Bases Configuration
bases:
  max-bases-per-clan: 5
  teleport-delay-seconds: 3
  cancel-teleport-on-move: true
  setbase-cost: 1000.0

# 5. Bank Configuration
bank:
  enabled: true
  max-item-slots: 54
  log-history-limit: 100
  leader-co-leader-withdraw-only: true

# 6. Chat Configuration
chat:
  format: "&8[&bClan&8] &f{PLAYER}: &7{MESSAGE}"
  spy-format: "&8[&cClanSpy&8] &8[&b{CLAN}&8] &f{PLAYER}: &7{MESSAGE}"

# 7. Placeholder Defaults
placeholders:
  no-clan: "&7Tidak Ada Clan"

# 8. GUI Sounds & Interaction
sounds:
  click: "UI_BUTTON_CLICK"
  success: "ENTITY_PLAYER_LEVELUP"
  error: "BLOCK_NOTE_BLOCK_BASS"
  kick: "ENTITY_LIGHTNING_BOLT_THUNDER"
  confirm: "BLOCK_NOTE_BLOCK_PLING"
  cancel: "BLOCK_NOTE_BLOCK_DIDGERIDOO"

# 9. Additional Customization Settings (Extended Configuration)
